name: Build APK

# Jalan otomatis tiap kali push ke main (dari Termux: git push), atau dipicu manual
# lewat tab Actions di GitHub. Build-nya 100% di server GitHub - HP/Termux cuma
# dipakai untuk edit kode + `git push`, TIDAK pernah build APK secara lokal.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # APK satu-satunya deliverable: debug build (sudah otomatis ditandatangani
      # pakai debug keystore bawaan Gradle, langsung bisa diinstal di HP).
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AzenithAI-Companion.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzenithAI-Companion
          path: out/AzenithAI-Companion.apk

      # Release "latest" yang selalu diperbarui -> link download tetap sama,
      # bisa dibuka langsung dari HP tanpa buka tab Actions.
      - name: Publish/refresh "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AzenithAI Companion (latest)
          body: Build otomatis dari commit ${{ github.sha }}.
          files: out/AzenithAI-Companion.apk
